name: Supabase Keep-Alive

on:
  schedule:
    # Runs once a week every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  # Allows triggering the workflow manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP GET request to Supabase
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          # Strip trailing slash if present
          CLEAN_URL="${SUPABASE_URL%/}"

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${CLEAN_URL}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Supabase HTTP response code: $RESPONSE"

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "Success: Supabase project is active and awake!"
          else
            echo "Error: Failed to reach Supabase. Received HTTP status $RESPONSE."
            exit 1
          fi
