name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth Health API
        run: |
          echo "Pinging health endpoint..."
          curl -sS --fail "${SUPABASE_URL}/auth/v1/health"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
